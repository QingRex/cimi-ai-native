<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CimiLoop 工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside>
      <a class="brand" href="#dashboard"><span class="brand-icon">C</span><span>CimiLoop<small>本地研发工作台</small></span></a>
      <nav aria-label="工作台导航">
        <a href="#dashboard" data-view="dashboard">项目工作台</a>
        <a href="#pool" data-view="pool">需求池与版本</a>
        <a href="#decisions" data-view="decisions">决定收件箱</a>
        <a href="#releases" data-view="releases">发布批次</a>
        <a href="#environments" data-view="environments">环境概览</a>
      </nav>
      <div class="sidebar-note">同一项目 · 同一事实源<br>页面与 CLI 共享 Kernel</div>
    </aside>
    <div class="main-shell">
      <header><div id="project-name">CimiLoop</div><div class="header-actions"><span id="operator">本地会话</span><button id="refresh" type="button">刷新</button></div></header>
      <div id="notice" role="status" aria-live="polite"></div>
      <main id="content"><p class="empty">正在连接本地项目…</p></main>
    </div>
  </div>
</body>
</html>
